services:
  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  stats-service:
    build:
      context: .
      dockerfile: services/stats-service/Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  psd-service:
    build:
      context: .
      dockerfile: services/psd-service/Dockerfile
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      EVENT_SERVICE_URL: http://event-service:8001
      STATS_SERVICE_URL: http://stats-service:8002
      PSD_SERVICE_URL: http://psd-service:8003
    depends_on:
      event-service:
        condition: service_started
      stats-service:
        condition: service_started
      psd-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web-ui:
    build:
      context: .
      dockerfile: services/web-ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      GATEWAY_URL: http://gateway:8000
    depends_on:
      - gateway
