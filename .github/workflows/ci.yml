name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz,services]" -c requirements.lock

      - name: Ruff lint
        run: ruff check packages services tests

      - name: Ruff format check
        run: ruff format --check packages services tests

      - name: Mypy
        run: mypy --python-version ${{ matrix.python-version }} packages/pynanopore/src/pynanopore

      - name: Pytest
        run: pytest tests/ --cov=pynanopore --cov-report=term-missing

      - name: Build wheel
        run: |
          pip install build
          python -m build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit lockfile
        run: pip-audit -r requirements.lock --progress-spinner off
